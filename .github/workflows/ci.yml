# Every gate that can run without the model endpoint, on every push.
#
# The `live` tests are deliberately absent: they need the LLM on a private
# network, which no runner can reach. Everything else here is the same set
# the project is developed against, so a green tick means the same thing on
# a runner as it does on a laptop.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # A second push to the same branch cancels the first: the older answer is
  # about code nobody has any more.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint, types and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # CPU wheels for torch. The GPU build is an order of magnitude
        # larger and nothing here uses a GPU.
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[dev,serve]" -c constraints.txt

      - name: Lint
        run: ruff check src tests

      - name: Format
        run: black --check src tests

      - name: Types
        run: mypy src

      - name: Tests
        run: pytest --cov=voicebot --cov-report=term-missing --cov-fail-under=90

  javascript:
    name: the barge-in detector
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No dependencies and no package.json: the detector is plain script
      # and its tests use node's own runner.
      - name: Tests
        run: node --test tests/js/vad.test.js
