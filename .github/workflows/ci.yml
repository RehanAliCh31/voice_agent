# Every gate that can run without the model endpoint, on every push.
#
# The `live` tests are deliberately absent: they need the LLM on a private
# network, which no runner can reach. Everything else here is the same set
# the project is developed against, so a green tick means the same thing on
# a runner as it does on a laptop.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # A second push to the same branch cancels the first: the older answer is
  # about code nobody has any more.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint, types and tests
    runs-on: ubuntu-latest

    # A real PostgreSQL for the length of the job. The suite runs on SQLite
    # and then on this, and coverage is measured across the two: each bank's
    # code runs only in its own pass, so either alone reads low.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serve,assistant]" -c constraints.txt

      - name: Assistant models
        # The voice activity model, about 2 MB and checked against its
        # pinned hash, so its tests run on the real file rather than being
        # skipped.
        run: python -m voicebot.assistant setup

      - name: Lint
        run: ruff check src tests scripts

      - name: Format
        run: black --check src tests scripts

      - name: Types
        run: mypy src scripts

      - name: Tests on SQLite
        run: pytest --cov=voicebot --cov-report=

      - name: Tests on PostgreSQL, and coverage across both
        # The tests make a database of their own on the server, and a schema
        # per test inside that.
        env:
          VOICEBOT_TEST_DATABASE: postgres
          VOICEBOT_DB_HOST: localhost
          VOICEBOT_DB_PORT: "5432"
          VOICEBOT_DB_USER: postgres
          # The password of a container that exists only for this job and is
          # thrown away with it -- not a secret anywhere else.
          VOICEBOT_DB_PASSWORD: postgres
        run: pytest --cov=voicebot --cov-append --cov-report=term-missing --cov-fail-under=90

  javascript:
    name: the live client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No dependencies and no package.json: the live client is plain script
      # and its tests use node's own runner.
      - name: Tests
        run: node --test tests/js/live.test.js tests/js/capture.test.js
