# The committed default: everything fake, nothing downloaded, no network.
#
# Starting the service with no VOICEBOT_CONFIG uses these same defaults, so
# this file exists to be copied and edited rather than to be run. For the real
# engines see configs/serve.yaml.

seed: 42

asr:
  engine: fake

tts:
  # `browser` hands synthesis to the page; `vits` synthesises here.
  engine: fake

llm:
  engine: fake
  # Set engine to `openai` and fill these in to talk to a real endpoint.
  base_url: ""
  model: ""
  api_key_env: VOICEBOT_LLM_KEY
  max_tool_rounds: 4
  max_turns: 20

database:
  # `:memory:` starts from the seeded demo state every run.
  path: ":memory:"
  seed_on_create: true
