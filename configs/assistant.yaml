# The hands-free assistant: every service it talks to, and every threshold.
#
#   python -m voicebot.assistant check    # validates this file and every endpoint
#   python -m voicebot.assistant run
#
# No secrets here, so this file is safe to commit. The LLM accepts any key or
# none; if one is ever needed it is read from the variable named below.
# Another file can be used instead with VOICEBOT_ASSISTANT_CONFIG=path.
#
# What each service was measured to do is in docs/assistant/endpoints.md.

asr:
  en:
    url: http://localhost:8092/v1/audio/transcriptions
    model: qwen3-asr
    response_format: json            # verbose_json is refused by qwen3-asr
  ur:
    url: http://localhost:8104/v1/audio/transcriptions
    model: whisper-urdu
    response_format: verbose_json    # carries the language heard and a confidence
  # Both answered a short question in 0.3-0.6 s, measured. A recogniser that
  # takes 6 s is down, and the other one decides alone; a timeout or 5xx is
  # retried once with backoff, a 4xx never.
  timeout_s: 6
  retries: 1
  min_avg_logprob: -0.8
  # What each recogniser makes of silence and noise, measured. A transcript
  # that is one of these, from less speech than phantom_max_speech_ms, is
  # dropped rather than answered.
  phantom_max_speech_ms: 600
  phantom_phrases:
    en: ["i", "okay", "ok", "you", "thank you", "thanks for watching", "so", "uh", "um", "hmm"]
    ur: ["ملتے ہیں", "ملتی ہے", "شکریہ", "thank you", "you"]

# Who the bot is, for the web bot and the hands-free assistant alike. `gender`
# is the one switch: the voice in both languages, the name, every fixed
# sentence (src/voicebot/messages.yaml) and how the model is told to speak of
# itself in Urdu all follow it. Every voice says whose it is, and one of the
# other gender, main or backup, stops startup. The model never chooses.
#
# Nothing is heard until the first piece of a reply is synthesised, so it is
# cut short (first_chunk_words), and the next pieces grow by chunk_growth so
# each is ready before the last one ends. Measured: OmniVoice costs ~2 s per
# request plus ~0.1 s a word, and a word lasts ~0.42 s; so a first piece of 8
# words (3.4 s of speech) covers the making of a second of up to ~13 words,
# where 5 words (2.1 s) left a silence after it in 19 Urdu turns of 20.
# qwen3-tts costs ~0.2 s a word, half real time: 5 words is enough.
# OmniVoice reads at ~0.42 s a word, slower than people speak Urdu; speed
# 1.15 says the same in 13% less time, made just as fast, and as clear (five
# Urdu sentences through whisper-urdu: 8.6% word errors at 1.0 and at 1.15).
# qwen3-tts takes the field but ignores it, so English is left as it is.
# OmniVoice says each reply whole (first_chunk_words 0, rest_max_words 60).
# Every request to it costs ~3 s before any sound, so any cut was a join, and
# at the join the next piece was still being made: tested by hand, the Urdu
# assistant stopped between sentences and at commas -- with a first piece cut
# short, in 14 turns of 20, and still after the first piece when the rest was
# sent whole. Now an ordinary reply is one request (60 spoken words take ~9 s,
# inside the 12 s limit), spoken as one utterance with the voice's own pauses;
# a longer one is parted only between sentences, into parts that play far
# longer than the next takes to make. Its answer starts ~1-2 s later than with
# a short first piece: smoothness was asked for over that.
# But where a reply's first sentence plays longer than its rest takes to make,
# it is split there (request_s, request_word_s and spoken_word_s, as measured:
# ~3.0 s a request and ~0.1 s a word to make; a word lasts ~0.365 s at speed
# 1.15): it starts once the first sentence alone is made, and the rest is
# ready before that ends, so nothing stops.
# What each voice is, and where it came from: LANGUAGE_VOICE_CONFIG.md.
agent:
  gender: female
  names:
    female: {en: Layla, ur: لیلیٰ}
    male: {en: Omar, ur: عمر}
  voices:
    female:
      en:
        url: http://localhost:8094/v1/audio/speech
        model: qwen3-tts             # the server lists itself as Qwen3-TTS-12Hz-0.6B-Base; both names work
        gender: female
        label: qwen3-tts, its one built-in voice
        first_chunk_words: 5
        chunk_growth: 1.6
      ur:
        url: http://localhost:8091/v1/audio/speech
        model: k2-fsa/OmniVoice
        extra: {speed: 1.15}
        voice: assistant-pk          # FLEURS ur_pk reference, CC-BY-4.0: attribution required
        gender: female
        label: OmniVoice assistant-pk
        first_chunk_words: 0
        rest_max_words: 60
        request_s: 3.0
        request_word_s: 0.1
        spoken_word_s: 0.365
        chunk_growth: 1.6
    male:
      en:
        url: http://localhost:8091/v1/audio/speech
        model: k2-fsa/OmniVoice      # qwen3-tts has no male voice
        extra: {speed: 1.15}
        voice: urdu_male5
        gender: male
        label: OmniVoice urdu_male5, in English
        first_chunk_words: 0
        rest_max_words: 60
        request_s: 3.0
        request_word_s: 0.1
        spoken_word_s: 0.365
        chunk_growth: 1.6
      ur:
        url: http://localhost:8091/v1/audio/speech
        model: k2-fsa/OmniVoice
        extra: {speed: 1.15}
        voice: urdu_male5
        gender: male
        label: OmniVoice urdu_male5
        first_chunk_words: 0
        rest_max_words: 60
        request_s: 3.0
        request_word_s: 0.1
        spoken_word_s: 0.365
        chunk_growth: 1.6
  # Tried when the main voice fails, before a kept recording. The English
  # backup is on the other server, so it survives the main one going down.
  # There is no second male voice on a second server to back the male ones.
  backup_voices:
    female:
      en:
        url: http://localhost:8091/v1/audio/speech
        model: k2-fsa/OmniVoice
        extra: {speed: 1.15}
        voice: assistant-en
        gender: female
        label: OmniVoice assistant-en
        first_chunk_words: 0
        rest_max_words: 60
        request_s: 3.0
        request_word_s: 0.1
        spoken_word_s: 0.365
        chunk_growth: 1.6
      ur:
        url: http://localhost:8091/v1/audio/speech
        model: k2-fsa/OmniVoice
        extra: {speed: 1.15}
        voice: assistant-ur
        gender: female
        label: OmniVoice assistant-ur
        first_chunk_words: 0
        rest_max_words: 60
        request_s: 3.0
        request_word_s: 0.1
        spoken_word_s: 0.365
        chunk_growth: 1.6

# tts.en and tts.ur come from agent.voices above.
tts:
  # A long Urdu reply took 5.7 s whole; the assistant asks for a sentence
  # at a time. Past 12 s the voice is down and the fallback plays instead.
  timeout_s: 12
  retries: 1
  trim_silence: true

llm:
  url: http://localhost:8001/v1/chat/completions
  model: qwen3.6-35b-a3b-fp8
  api_key_env: VOICEBOT_LLM_KEY
  max_tokens: 150
  temperature: 0.4
  # Per read: the longest the stream may go quiet, first token included.
  timeout_s: 12
  # The whole reply, retries included: past this it is cut off and the
  # fallback phrase is said, however steadily words were still arriving.
  total_timeout_s: 30
  # A timeout, a dropped connection, a 429 or a 5xx before the first word is
  # retried once with backoff; a 4xx never, and nothing after the first word.
  retries: 1
  stream: true
  disable_thinking: true
  history_turns: 6
  system_prompts:
    en: >-
      You are a polite, helpful voice assistant for a bank, talking with a customer.
      Reply in English, in one to three short sentences that sound natural when spoken,
      and keep the whole reply under 40 words.
      Never use markdown, lists, emojis or links: everything you write is read aloud.
      Never ask for, or repeat, a PIN, password, OTP, card number or account number.
      For anything sensitive, tell the customer to use the bank's official app,
      website or helpline.
    ur: >-
      آپ ایک مؤدب اور مددگار بینک اسسٹنٹ ہیں جو ایک صارف سے بات کر رہے ہیں۔
      صرف اردو میں، اردو رسم الخط میں، ایک سے تین مختصر جملوں میں جواب دیں جو بولنے میں فطری لگیں،
      اور پورا جواب چالیس الفاظ سے کم رکھیں۔
      کوئی مارک ڈاؤن، فہرست، ایموجی یا لنک استعمال نہ کریں، کیونکہ آپ کا جواب بول کر سنایا جائے گا۔
      کبھی بھی پن، پاس ورڈ، او ٹی پی، کارڈ نمبر یا اکاؤنٹ نمبر نہ مانگیں اور نہ دہرائیں۔
      حساس کاموں کے لیے صارف سے کہیں کہ وہ بینک کی آفیشل ایپ، ویب سائٹ یا ہیلپ لائن استعمال کرے۔

audio:
  sample_rate: 16000
  input_device:                      # a name, part of one, or an index from `devices`
  output_device:
  queue_frames: 64

wake_word:
  phrase: Hey Jarvis
  model: hey_jarvis_v0.1             # openWakeWord's pre-trained model: non-commercial licence
  models_dir: models/openwakeword
  threshold: 0.5
  cooldown_ms: 1500

vad:
  model_path: models/silero/silero_vad.onnx
  threshold: 0.5
  neg_threshold: 0.35
  pre_roll_ms: 300
  min_speech_ms: 250
  end_silence_ms: 800
  max_utterance_s: 20                # Whisper reads at most 30 s at a time
  no_speech_timeout_s: 6

session:
  language: auto                     # auto, en or ur
  follow_up_s: 8
  max_session_s: 300
  earcon: true
  echo_mode: speakers                # speakers or headphones
  echo_tail_ms: 300
  barge_in_min_speech_ms: 300
  post_wake_ignore_ms: 0
  commands:
    stop:
      en: ["stop", "cancel", "never mind", "nevermind", "be quiet", "quiet", "shut up", "stop it"]
      ur: ["رک جاؤ", "رکو", "بس", "بس کرو", "بند کرو", "خاموش", "خاموش ہو جاؤ", "چپ", "سٹاپ", "اسٹاپ"]
    goodbye:
      en: ["goodbye", "good bye", "bye", "bye bye", "that's all", "that is all", "thank you goodbye"]
      ur: ["خدا حافظ", "اللہ حافظ", "بائے", "بائے بائے", "بس شکریہ", "شکریہ بس"]

debug:
  save_audio: false                  # microphone audio is never written to disk unless this is on
  audio_dir: debug_audio
