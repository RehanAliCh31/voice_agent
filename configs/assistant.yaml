# The office services the voice bot talks to -- its recognisers and voices --
# and who the bot is.
#
#   python -m voicebot.assistant check    # validates this file and every endpoint
#
# No secrets here, so this file is safe to commit.
# Another file can be used instead with VOICEBOT_ASSISTANT_CONFIG=path.
#
# What each service was measured to do is in README.md, "The office services".

asr:
  en:
    url: ${VOICEBOT_QWEN_ASR_URL:-http://localhost:8092}/v1/audio/transcriptions
    model: qwen3-asr
    response_format: json            # verbose_json is refused by qwen3-asr
  ur:
    url: ${VOICEBOT_WHISPER_URDU_URL:-http://localhost:8104}/v1/audio/transcriptions
    model: whisper-urdu
    response_format: verbose_json    # carries the language heard and a confidence
  # Both answered a short question in 0.3-0.6 s, measured. A recogniser that
  # takes 6 s is down, and the other one decides alone; a timeout or 5xx is
  # retried once with backoff, a 4xx never.
  timeout_s: 6
  retries: 1
  min_avg_logprob: -0.8
  # What each recogniser makes of silence and noise, measured. A transcript
  # that is one of these, from less speech than phantom_max_speech_ms, is
  # dropped rather than answered.
  phantom_max_speech_ms: 600
  phantom_phrases:
    en: ["i", "okay", "ok", "you", "thank you", "thanks for watching", "so", "uh", "um", "hmm"]
    ur: ["ملتے ہیں", "ملتی ہے", "شکریہ", "thank you", "you"]

# Who the bot is, for the push-to-talk and live sessions alike. `gender`
# is the one switch: the voice in both languages, the name, every fixed
# sentence (src/voicebot/messages.yaml) and how the model is told to speak of
# itself in Urdu all follow it. Every voice says whose it is, and one of the
# other gender, main or backup, stops startup. The model never chooses.
#
# Nothing is heard until the first piece of a reply is synthesised, so it is
# cut short (first_chunk_words), and the next pieces grow by chunk_growth so
# each is ready before the last one ends. Measured: OmniVoice costs ~2 s per
# request plus ~0.1 s a word, and a word lasts ~0.42 s; so a first piece of 8
# words (3.4 s of speech) covers the making of a second of up to ~13 words,
# where 5 words (2.1 s) left a silence after it in 19 Urdu turns of 20.
# qwen3-tts costs ~0.2 s a word, half real time: 5 words is enough.
# OmniVoice reads at ~0.42 s a word, slower than people speak Urdu; speed
# 1.15 says the same in 13% less time, made just as fast, and as clear (five
# Urdu sentences through whisper-urdu: 8.6% word errors at 1.0 and at 1.15).
# qwen3-tts takes the field but ignores it, so English is left as it is.
# OmniVoice says each reply whole (first_chunk_words 0, rest_max_words 60).
# Every request to it costs ~3 s before any sound, so any cut was a join, and
# at the join the next piece was still being made: tested by hand, the Urdu
# assistant stopped between sentences and at commas -- with a first piece cut
# short, in 14 turns of 20, and still after the first piece when the rest was
# sent whole. Now an ordinary reply is one request (60 spoken words take ~9 s,
# inside the 12 s limit), spoken as one utterance with the voice's own pauses;
# a longer one is parted only between sentences, into parts that play far
# longer than the next takes to make. Its answer starts ~1-2 s later than with
# a short first piece: smoothness was asked for over that.
# But where a reply's first sentence(s) play longer than the next piece takes
# to make, they go alone (request_s, request_word_s and spoken_word_s, as
# measured on 2026-11-02: ~1.8 s a request and ~0.12 s a word to make, within
# 4% from one request to the next; a word lasts ~0.32 s at speed 1.15): the
# reply starts once they alone are made, and the next piece is ready before
# they end, so nothing stops. OmniVoice makes one clip at a time.
# What each voice is, and where it came from: README.md, "Language, voice and gender".
agent:
  gender: female
  names:
    female: {en: Layla, ur: لیلیٰ}
    male: {en: Omar, ur: عمر}
  voices:
    female:
      en:
        url: ${VOICEBOT_QWEN_TTS_URL:-http://localhost:8094}/v1/audio/speech
        model: qwen3-tts             # the server lists itself as Qwen3-TTS-12Hz-0.6B-Base; both names work
        gender: female
        label: qwen3-tts, its one built-in voice
        first_chunk_words: 5
        chunk_growth: 1.6
      ur:
        url: ${VOICEBOT_OMNIVOICE_URL:-http://localhost:8091}/v1/audio/speech
        model: k2-fsa/OmniVoice
        extra: {speed: 1.15}
        voice: assistant-pk          # FLEURS ur_pk reference, CC-BY-4.0: attribution required
        gender: female
        label: OmniVoice assistant-pk
        first_chunk_words: 0
        rest_max_words: 60
        request_s: 1.8
        request_word_s: 0.12
        spoken_word_s: 0.32
        chunk_growth: 1.6
    male:
      en:
        url: ${VOICEBOT_OMNIVOICE_URL:-http://localhost:8091}/v1/audio/speech
        model: k2-fsa/OmniVoice      # qwen3-tts has no male voice
        extra: {speed: 1.15}
        voice: urdu_male5
        gender: male
        label: OmniVoice urdu_male5, in English
        first_chunk_words: 0
        rest_max_words: 60
        request_s: 1.8
        request_word_s: 0.12
        spoken_word_s: 0.32
        chunk_growth: 1.6
      ur:
        url: ${VOICEBOT_OMNIVOICE_URL:-http://localhost:8091}/v1/audio/speech
        model: k2-fsa/OmniVoice
        extra: {speed: 1.15}
        voice: urdu_male5
        gender: male
        label: OmniVoice urdu_male5
        first_chunk_words: 0
        rest_max_words: 60
        request_s: 1.8
        request_word_s: 0.12
        spoken_word_s: 0.32
        chunk_growth: 1.6
  # Tried when the main voice fails, before a kept recording. The English
  # backup is on the other server, so it survives the main one going down.
  # There is no second male voice on a second server to back the male ones.
  backup_voices:
    female:
      en:
        url: ${VOICEBOT_OMNIVOICE_URL:-http://localhost:8091}/v1/audio/speech
        model: k2-fsa/OmniVoice
        extra: {speed: 1.15}
        voice: assistant-en
        gender: female
        label: OmniVoice assistant-en
        first_chunk_words: 0
        rest_max_words: 60
        request_s: 1.8
        request_word_s: 0.12
        spoken_word_s: 0.32
        chunk_growth: 1.6
      ur:
        url: ${VOICEBOT_OMNIVOICE_URL:-http://localhost:8091}/v1/audio/speech
        model: k2-fsa/OmniVoice
        extra: {speed: 1.15}
        voice: assistant-ur
        gender: female
        label: OmniVoice assistant-ur
        first_chunk_words: 0
        rest_max_words: 60
        request_s: 1.8
        request_word_s: 0.12
        spoken_word_s: 0.32
        chunk_growth: 1.6

# tts.en and tts.ur come from agent.voices above.
tts:
  # A long Urdu reply took 5.7 s whole; the assistant asks for a sentence
  # at a time. Past 12 s the voice is down and the fallback plays instead.
  timeout_s: 12
  retries: 1
  trim_silence: true

llm:
  # Where the model is, for `check`. The service's own model settings are in
  # configs/serve.yaml.
  url: ${VOICEBOT_LLM_URL:-http://localhost:8001}/v1/chat/completions
  model: qwen3.6-35b-a3b-fp8
