# Serving configuration: the real engines, on this machine.
#
# Run with:
#   VOICEBOT_CONFIG=configs/serve.yaml \
#     .venv/Scripts/python -m uvicorn voicebot.api.app:app --port 8000
#
# No API key appears here. The key, if the endpoint ever needs one, is read
# from the environment variable named below, so this file is safe to commit.

seed: 42

asr:
  # The office recognisers, English and Urdu (qwen3-asr and whisper-urdu),
  # both hearing every question so the language is decided each turn. Their
  # addresses are in the file named by `endpoints`.
  # `engine: whisper` goes back to the local, English-only model below.
  engine: endpoints
  endpoints: configs/assistant.yaml
  model_name: openai/whisper-base.en
  device: cpu
  language: en

tts:
  # The office voices: qwen3-tts for English, OmniVoice for Urdu, chosen by
  # the reply's own script and played by the page. `engine: browser` goes back
  # to the browser's own synthesiser, which has no Urdu voice.
  engine: endpoints
  endpoints: configs/assistant.yaml

llm:
  engine: openai
  base_url: http://localhost:8001/v1
  model: qwen3.6-35b-a3b-fp8
  api_key_env: VOICEBOT_LLM_KEY
  timeout_s: 30.0
  max_retries: 2
  temperature: 0.4
  # Replies are spoken aloud, so they are short by design.
  max_tokens: 200
  max_tool_rounds: 4
  max_turns: 20

database:
  # PostgreSQL, reached with VOICEBOT_DB_* from the environment or .env.
  # To go back to SQLite, set `engine: sqlite`: `path` below is the untouched
  # file the data was migrated from, and it is read again exactly as before.
  engine: postgres
  path: data/bank.db
  seed_on_create: true
  pool_size: 10
