# Serving configuration: the real engines, on this machine.
#
# Run with:
#   VOICEBOT_CONFIG=configs/serve.yaml \
#     .venv/Scripts/python -m uvicorn voicebot.api.app:app --port 8000
#
# No API key appears here. The key, if the endpoint ever needs one, is read
# from the environment variable named below, so this file is safe to commit.

seed: 42

asr:
  # The office recognisers, English and Urdu (qwen3-asr and whisper-urdu),
  # both hearing every question so the language is decided each turn. Their
  # addresses are in the file named by `endpoints`.
  # `engine: whisper` goes back to the local, English-only model below.
  engine: endpoints
  endpoints: configs/assistant.yaml
  model_name: openai/whisper-base.en
  device: cpu
  language: en

tts:
  # The office voices: qwen3-tts for English, OmniVoice for Urdu, chosen by
  # the reply's own script and played by the page. `engine: browser` goes back
  # to the browser's own synthesiser, which has no Urdu voice.
  engine: endpoints
  endpoints: configs/assistant.yaml

llm:
  engine: openai
  base_url: http://localhost:8001/v1
  model: qwen3.6-35b-a3b-fp8
  api_key_env: VOICEBOT_LLM_KEY
  # One request; a long reply measured 9.4 s. The caller hears silence for
  # all of it, so a dead server is given up on fast, and retried once.
  timeout_s: 12.0
  max_retries: 1
  temperature: 0.4
  # Replies are spoken aloud, so they are short by design.
  max_tokens: 200
  max_tool_rounds: 4
  max_turns: 20

database:
  # PostgreSQL, reached with VOICEBOT_DB_* from the environment or .env.
  # To go back to SQLite, set `engine: sqlite`: `path` below is the untouched
  # file the data was migrated from, and it is read again exactly as before.
  engine: postgres
  path: data/bank.db
  seed_on_create: true
  pool_size: 10
  # A free connection is waited for this long, and no statement may run, or
  # wait for a lock, longer than this. A hung query must not hold a caller.
  pool_timeout_s: 5.0
  statement_timeout_ms: 5000
  lock_timeout_ms: 3000

# How provider calls are cut off and retried; see ERROR_HANDLING.md.
resilience:
  turn_budget_s: 20.0        # every model round of one turn, together
  retry_base_s: 0.2          # backoff: up to 0.2 s, 0.4 s ... with jitter
  retry_cap_s: 1.0
  breaker_failures: 3        # a provider failing this often in a row is skipped
  breaker_cooldown_s: 20.0   # for this long, then tried again

# How long a conversation may run, and when a colleague takes over.
session:
  max_turns: 60
  max_minutes: 30
  warn_turns: 3
  failure_limit: 3           # failed turns in a row before handing over
  busy_wait_s: 2.0

# The record of each turn is written after the turn, never during it.
audit:
  retries: 3
  dead_letter: data/dead_letter/turns.jsonl
