# E1 - RoBERTa-base (125M)
seed: 42
data_dir: data

asr:
  engine: fake

nlu:
  engine: fake
  encoder_name: roberta-base
  max_length: 64
  oos_threshold: 0.5

tts:
  engine: fake

training:
  learning_rate: 2.0e-5
  batch_size: 32
  epochs: 5
  warmup_ratio: 0.1
  weight_decay: 0.01
  slot_loss_weight: 1.0
  early_stopping_patience: 2
  dropout: 0.1
  device: auto
