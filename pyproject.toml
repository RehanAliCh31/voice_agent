[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicebot"
version = "0.2.0"
description = "Cascaded speech-to-speech conversational voice bot"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "torch>=2.2",
    "transformers>=4.40",
]

[project.optional-dependencies]
# httpx is here rather than in `serve` because FastAPI's TestClient needs
# it; the API tests run as part of the ordinary suite.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
]
# The database driver is here rather than in the core dependencies because
# only a served bank needs it: the offline path and the default test run use
# an in-memory SQLite bank, and import nothing from psycopg.
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    # The live voice session: uvicorn serves WebSockets only with this (or
    # wsproto) installed; it is what uvicorn's own [standard] extra brings.
    "websockets>=13",
    # Silero VAD on the server, for the live session's endpointing and barge-in.
    "onnxruntime>=1.18",
]
# The hands-free assistant: the microphone and speaker, and onnxruntime for
# the wake word and voice activity models. Not the openwakeword package: on
# Linux it needs tflite-runtime, which has no build for Python 3.12.
assistant = [
    "sounddevice>=0.5",
    "onnxruntime>=1.18",
    "scipy>=1.11",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

# The frontend and the SQL are package data, not loose files: they then ship
# inside a wheel exactly as they do in an editable install. The SQL was
# missing from this list, so a wheel -- which is what the Dockerfile installs
# -- had no schema.sql, and the bank could not open.
[tool.setuptools.package-data]
voicebot = ["api/static/*", "bank/*.sql", "bank/migrations/*.sql", "messages.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `live` tests need the real LLM endpoint, which is on a private network.
# They are deselected by default so the suite runs anywhere, offline, in
# seconds. Run them deliberately with: pytest -m live
addopts = "-q -m 'not live'"
markers = ["live: needs the real LLM endpoint; deselected by default"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Where first-party code lives, so our own imports sort as ours.
src = ["src"]

[tool.ruff.lint]
# Pinned explicitly: relying on ruff's default selection means a ruff
# upgrade can fail the lint with no code change.
select = ["E", "F", "I", "UP", "RUF"]
# Urdu's full stop, comma and question mark, its digits, and a typographic
# apostrophe: the assistant's text handling exists to deal with exactly these.
allowed-confusables = ["۔", "،", "؟", "۰", "۱", "۲", "۳", "۴", "۵", "۶", "۷", "۸", "۹", "’", "‘"]

[tool.coverage.run]
source = ["voicebot"]
branch = true

[tool.coverage.report]
# Lines that exist to be unreachable, and the guards that make them so.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '@(abc\.)?abstractmethod',
    "pragma: no cover",
]
show_missing = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
