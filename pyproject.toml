[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicebot"
version = "0.2.0"
description = "Cascaded speech-to-speech conversational voice bot"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "torch>=2.2",
    "transformers>=4.40",
]

[project.optional-dependencies]
# httpx is here rather than in `serve` because FastAPI's TestClient needs
# it; the API tests run as part of the ordinary suite.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
where = ["src"]

# The frontend is package data, not a loose directory: it then ships
# inside a wheel exactly as it does in an editable install.
[tool.setuptools.package-data]
voicebot = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `live` tests need the real LLM endpoint, which is on a private network.
# They are deselected by default so the suite runs anywhere, offline, in
# seconds. Run them deliberately with: pytest -m live
addopts = "-q -m 'not live'"
markers = ["live: needs the real LLM endpoint; deselected by default"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Where first-party code lives, so our own imports sort as ours.
src = ["src"]

[tool.ruff.lint]
# Pinned explicitly: relying on ruff's default selection means a ruff
# upgrade can fail the lint with no code change.
select = ["E", "F", "I", "UP", "RUF"]

[tool.coverage.run]
source = ["voicebot"]
branch = true

[tool.coverage.report]
# Lines that exist to be unreachable, and the guards that make them so.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '@(abc\.)?abstractmethod',
    "pragma: no cover",
]
show_missing = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
