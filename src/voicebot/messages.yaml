# Every sentence the bot says in words of its own -- and nothing else.
#
# One place for each fixed sentence, in English and in Urdu, so the wording
# can be reviewed and changed without reading code: what the bot says when
# something has gone wrong, and the few lines it says without the model. Each
# is short, polite, true, and never technical: a customer is told what they
# can do next, not what failed inside.
#
# The bot is a woman or a man (`agent.gender` in configs/assistant.yaml), and
# Urdu says which whenever it speaks of itself: "میں سمجھ نہیں سکی" is a
# woman, "میں سمجھ نہیں سکا" a man. So a sentence like that gives both:
#
#   ur:
#     female: ...
#     male: ...
#
# and the profile's gender picks one. A sentence the same for both is given
# once. English is the same for both throughout.
#
# Checked when it loads: every message needs both languages; the ones that
# carry a value ({reference}) must carry it in every form; an Urdu sentence
# given once must not speak of the bot in either gender, and each gendered
# form only in its own. A file that fails the check stops the service at
# startup rather than mid-call.
#
# Keys starting `prompt_` are shown to the model, never said aloud.
#
# Urdu is in logical order, as typed. Nothing reverses, reshapes or "fixes"
# it on the way to the voice.

# The model could not be reached at all.
unavailable:
  en: "Sorry — I can't reach the service just now. Please try again in a moment."
  ur: "معذرت، اس وقت سروس سے رابطہ نہیں ہو پا رہا۔ براہِ کرم تھوڑی دیر بعد دوبارہ کوشش کریں۔"

# The model answered with nothing, or ran out of rounds.
nothing_said:
  en: "Sorry, I didn't catch that. Could you say it again?"
  ur:
    female: "معذرت، میں سمجھ نہیں سکی۔ کیا آپ دوبارہ کہہ سکتے ہیں؟"
    male: "معذرت، میں سمجھ نہیں سکا۔ کیا آپ دوبارہ کہہ سکتے ہیں؟"

# The microphone heard nothing worth answering.
not_caught:
  en: "I didn't catch that. Could you say it again?"
  ur:
    female: "میں سمجھ نہیں سکی۔ کیا آپ دوبارہ کہہ سکتے ہیں؟"
    male: "میں سمجھ نہیں سکا۔ کیا آپ دوبارہ کہہ سکتے ہیں؟"

# The speech recognisers are down: the customer spoke, and the service failed them.
speech_unavailable:
  en: "Sorry — I'm having trouble hearing you just now. You can type your question instead, or try again in a moment."
  ur: "معذرت، اس وقت مجھے آپ کی آواز سننے میں دشواری ہو رہی ہے۔ آپ اپنا سوال لکھ کر بھیج سکتے ہیں، یا تھوڑی دیر بعد دوبارہ کوشش کریں۔"

# The recording that arrived could not be used.
bad_audio:
  en: "Sorry, I couldn't use that recording. Could you try again?"
  ur:
    female: "معذرت، میں اس ریکارڈنگ کو استعمال نہیں کر سکی۔ کیا آپ دوبارہ کوشش کریں گے؟"
    male: "معذرت، میں اس ریکارڈنگ کو استعمال نہیں کر سکا۔ کیا آپ دوبارہ کوشش کریں گے؟"

# The customer asked for a person; assembled from the case, so the reference is exact.
handed_over:
  en: "Of course — I'm passing you to a colleague. Your reference is {reference}, and someone will pick this up shortly."
  ur:
    female: "ضرور، میں آپ کو اپنے ایک ساتھی سے ملا رہی ہوں۔ آپ کا ریفرنس {reference} ہے، اور جلد ہی کوئی آپ سے رابطہ کرے گا۔"
    male: "ضرور، میں آپ کو اپنے ایک ساتھی سے ملا رہا ہوں۔ آپ کا ریفرنس {reference} ہے، اور جلد ہی کوئی آپ سے رابطہ کرے گا۔"

# The model promised a lookup and never made one.
not_looked_up:
  en: "Sorry — I couldn't look that up just now. Could you ask me again?"
  ur:
    female: "معذرت، میں ابھی یہ معلومات حاصل نہیں کر سکی۔ کیا آپ دوبارہ پوچھ سکتے ہیں؟"
    male: "معذرت، میں ابھی یہ معلومات حاصل نہیں کر سکا۔ کیا آپ دوبارہ پوچھ سکتے ہیں؟"

# The guard stopped an unsourced figure and had no real one to read instead.
unverified:
  en: "Let me check that properly — could you ask me again?"
  ur:
    female: "میں اسے ٹھیک سے دیکھنا چاہتی ہوں، کیا آپ دوبارہ پوچھ سکتے ہیں؟"
    male: "میں اسے ٹھیک سے دیکھنا چاہتا ہوں، کیا آپ دوبارہ پوچھ سکتے ہیں؟"

# Money is about to move and only the PIN is missing.
pin_needed:
  en: "Enter your PIN to approve this."
  ur: "اس کی منظوری کے لیے اپنا پن درج کریں۔"

# A lookup failed: the bank could not be read. Never followed by a guess.
tool_failed:
  en: "Sorry — I'm having trouble checking that right now. Please try again in a moment."
  ur:
    female: "معذرت، میں ابھی یہ چیک نہیں کر پا رہی۔ براہِ کرم تھوڑی دیر بعد دوبارہ کوشش کریں۔"
    male: "معذرت، میں ابھی یہ چیک نہیں کر پا رہا۔ براہِ کرم تھوڑی دیر بعد دوبارہ کوشش کریں۔"

# A write failed in a way that leaves it unknown whether it happened.
outcome_unknown:
  en: "I'm sorry — I couldn't confirm whether that went through. Please check your balance before you try it again."
  ur:
    female: "معذرت، میں تصدیق نہیں کر سکی کہ یہ کام مکمل ہوا یا نہیں۔ دوبارہ کوشش کرنے سے پہلے براہِ کرم اپنا بیلنس دیکھ لیں۔"
    male: "معذرت، میں تصدیق نہیں کر سکا کہ یہ کام مکمل ہوا یا نہیں۔ دوبارہ کوشش کرنے سے پہلے براہِ کرم اپنا بیلنس دیکھ لیں۔"

# The action the customer agreed to went through, but the model could not be
# reached to say so. The balances on the page are already the new ones.
action_done:
  en: "That's done — it has gone through. I can't reach the rest of the service just now, so please check your balance on the screen."
  ur: "یہ کام ہو گیا ہے۔ اس وقت باقی سروس سے رابطہ نہیں ہو پا رہا، اس لیے براہِ کرم اپنا بیلنس اسکرین پر دیکھ لیں۔"

# Cancel was pressed, and the model could not be reached to say so.
action_cancelled:
  en: "Okay, I've cancelled that. Nothing has changed."
  ur: "ٹھیک ہے، میں نے اسے منسوخ کر دیا ہے۔ کچھ بھی تبدیل نہیں ہوا۔"

# Several turns in a row have failed, and a colleague has been asked to help.
escalated:
  en: "I'm sorry for the trouble. I've passed this to a colleague, and your reference is {reference}. Someone will pick it up shortly."
  ur: "پریشانی کے لیے معذرت۔ میں نے یہ معاملہ اپنے ایک ساتھی کے حوالے کر دیا ہے، اور آپ کا ریفرنس {reference} ہے۔ جلد ہی کوئی آپ سے رابطہ کرے گا۔"

# Several turns in a row have failed, and no case could be opened either.
cannot_complete:
  en: "I'm sorry, I can't help with this right now. Please try again later, or contact the bank's helpline."
  ur:
    female: "معذرت، میں اس وقت اس میں مدد نہیں کر سکتی۔ براہِ کرم بعد میں دوبارہ کوشش کریں، یا بینک کی ہیلپ لائن سے رابطہ کریں۔"
    male: "معذرت، میں اس وقت اس میں مدد نہیں کر سکتا۔ براہِ کرم بعد میں دوبارہ کوشش کریں، یا بینک کی ہیلپ لائن سے رابطہ کریں۔"

# Said after a reply when the conversation is close to its limit.
session_warning:
  en: "Just so you know, I'll need to close this conversation soon."
  ur:
    female: "آپ کو بتاتی چلوں کہ مجھے جلد ہی یہ گفتگو ختم کرنی ہوگی۔"
    male: "آپ کو بتاتا چلوں کہ مجھے جلد ہی یہ گفتگو ختم کرنی ہوگی۔"

# The conversation reached its limit on turns or time, and starts over.
session_ended:
  en: "This conversation has reached its limit, so I'm closing it now. Thank you, and goodbye."
  ur:
    female: "یہ گفتگو اپنی حد تک پہنچ گئی ہے، اس لیے میں اسے ابھی ختم کر رہی ہوں۔ شکریہ، اللہ حافظ۔"
    male: "یہ گفتگو اپنی حد تک پہنچ گئی ہے، اس لیے میں اسے ابھی ختم کر رہا ہوں۔ شکریہ، اللہ حافظ۔"

# A second request arrived while the first for the same conversation was still running.
busy:
  en: "One moment — I'm still answering your last question."
  ur:
    female: "ایک لمحہ، میں ابھی آپ کے پچھلے سوال کا جواب دے رہی ہوں۔"
    male: "ایک لمحہ، میں ابھی آپ کے پچھلے سوال کا جواب دے رہا ہوں۔"

# The service is shutting down or restarting.
restarting:
  en: "I'm restarting for a moment. Please try again shortly."
  ur:
    female: "میں ایک لمحے کے لیے دوبارہ شروع ہو رہی ہوں۔ براہِ کرم تھوڑی دیر بعد دوبارہ کوشش کریں۔"
    male: "میں ایک لمحے کے لیے دوبارہ شروع ہو رہا ہوں۔ براہِ کرم تھوڑی دیر بعد دوبارہ کوشش کریں۔"

# Anything else: a failure with no better sentence.
internal:
  en: "Sorry — something went wrong on my side. Please try that again."
  ur: "معذرت، میری طرف سے کچھ خرابی ہو گئی۔ براہِ کرم دوبارہ کوشش کریں۔"

# The model wrote its answer in the wrong language twice, or mixed two: it is
# not spoken, and this is said instead.
reply_failed:
  en: "Sorry, I couldn't put that answer into words properly. Could you ask me again?"
  ur:
    female: "معذرت، میں اس کا جواب ٹھیک سے نہیں دے سکی۔ کیا آپ دوبارہ پوچھ سکتے ہیں؟"
    male: "معذرت، میں اس کا جواب ٹھیک سے نہیں دے سکا۔ کیا آپ دوبارہ پوچھ سکتے ہیں؟"

# Both voices failed on a reply: it is on the screen, and this recording,
# made in advance in the bot's own voice, says so.
voice_unavailable:
  en: "Sorry, my voice isn't working just now. My answer is on your screen."
  ur: "معذرت، اس وقت میری آواز کام نہیں کر رہی۔ میرا جواب آپ کی اسکرین پر ہے۔"

# Said by the page itself when it cannot reach the service at all.
connection_lost:
  en: "Sorry — I've lost the connection. Please check your network and try again."
  ur: "معذرت، رابطہ منقطع ہو گیا ہے۔ براہِ کرم اپنا نیٹ ورک دیکھیں اور دوبارہ کوشش کریں۔"

# Said by the page itself when the browser would not give it the microphone.
microphone_refused:
  en: "The microphone wasn't allowed, so your voice isn't reaching me. You can still type below."
  ur: "مائیکروفون کی اجازت نہیں ملی، اس لیے آواز نہیں آ رہی۔ آپ نیچے لکھ کر بات کر سکتے ہیں۔"

# Said by the page itself when there is no microphone it can open.
microphone_unavailable:
  en: "The microphone isn't available just now. You can still type below."
  ur: "اس وقت مائیکروفون دستیاب نہیں ہے۔ آپ نیچے لکھ کر بات کر سکتے ہیں۔"

# Said by the page itself when the microphone went away mid-conversation.
microphone_lost:
  en: "The microphone was disconnected. Tap the microphone to start again."
  ur: "مائیکروفون منقطع ہو گیا ہے۔ دوبارہ شروع کرنے کے لیے مائیکروفون دبائیں۔"

# Said by the page itself when a reply takes too long to arrive.
timed_out:
  en: "Sorry — that took too long. Please try again."
  ur: "معذرت، اس میں بہت دیر لگ گئی۔ براہِ کرم دوبارہ کوشش کریں۔"

# The hands-free assistant: a turn failed and there is nothing better to say.
trouble:
  en: "Sorry, I'm having trouble right now. Please try again in a moment."
  ur: "معذرت، اس وقت مجھے کچھ دشواری ہو رہی ہے۔ براہِ کرم تھوڑی دیر بعد دوبارہ کوشش کریں۔"

# The hands-free assistant: the customer said goodbye.
goodbye:
  en: "Goodbye, and have a good day."
  ur: "اللہ حافظ۔"

# How the bot speaks of itself in Urdu, shown to the model as examples of
# the forms to use. Never said aloud.
prompt_self_forms:
  en: "I can help; I am checking; I will check; I could not understand"
  ur:
    female: "میں مدد کر سکتی ہوں؛ میں دیکھ رہی ہوں؛ میں چیک کروں گی؛ میں سمجھ نہیں سکی"
    male: "میں مدد کر سکتا ہوں؛ میں دیکھ رہا ہوں؛ میں چیک کروں گا؛ میں سمجھ نہیں سکا"

# The guard stopped a figure the model made up, and reads the bank's own
# instead: {figures} is one figure, or several joined, always in digits.
figure_one:
  en: "The figure I have is {figures}."
  ur: "میرے پاس موجود رقم {figures} ہے۔"
figure_many:
  en: "The figures I have are {figures}."
  ur: "میرے پاس موجود رقمیں {figures} ہیں۔"

# An action is armed but the model could not read it back. In English the
# bank's own summary is said; in Urdu that summary, which is in English, is
# on the screen beside the Yes button, and this points to it.
readback_on_screen:
  en: "Please check the details on your screen, and confirm if they are right."
  ur: "براہِ کرم اپنی اسکرین پر تفصیل دیکھ لیں، اور درست ہو تو تصدیق کر دیں۔"

# A live session: nothing has been said for a while.
still_there:
  en: "Are you still there? I'm listening."
  ur:
    female: "کیا آپ ابھی موجود ہیں؟ میں سن رہی ہوں۔"
    male: "کیا آپ ابھی موجود ہیں؟ میں سن رہا ہوں۔"

# A live session: still nothing after asking, so it is ended.
idle_goodbye:
  en: "I'll end our call now. Thank you, and goodbye."
  ur:
    female: "میں اب ہماری کال ختم کر رہی ہوں۔ شکریہ، اللہ حافظ۔"
    male: "میں اب ہماری کال ختم کر رہا ہوں۔ شکریہ، اللہ حافظ۔"
